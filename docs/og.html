<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Evict social preview</title>
<!-- The source of og.png: open it in Chrome at 1200×630 (device mode) and save a screenshot. Not published. -->
<style>
:root{--bg:#0c0e12;--fg:#f2f4f7;--soft:#c3c9d4;--line:#262b35;--accent:#e0473d}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden;background:var(--bg);color:var(--fg);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
.bg{position:absolute;inset:0;background:radial-gradient(520px 380px at 12% 8%,rgba(224,71,61,.2),transparent 70%),radial-gradient(560px 420px at 88% 70%,rgba(61,127,230,.14),transparent 70%)}
.grid{position:absolute;inset:0;background:linear-gradient(rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px,linear-gradient(90deg,rgba(255,255,255,.035) 1px,transparent 1px) 0 0/40px 40px;-webkit-mask-image:radial-gradient(80% 90% at 25% 40%,#000,transparent)}
.brand{position:absolute;left:72px;top:62px;display:flex;align-items:center;gap:12px;font-size:32px;font-weight:800;letter-spacing:-.02em}
.brand .word span{color:var(--accent)}
.brand svg{width:40px;height:40px}
h1{position:absolute;left:72px;top:170px;margin:0;font-size:78px;line-height:.98;letter-spacing:-.05em;font-weight:800}
h1 span{color:var(--accent)}
.sub{position:absolute;left:74px;top:340px;margin:0;font-size:26px;line-height:1.45;color:var(--soft)}
.chips{position:absolute;left:72px;bottom:62px;display:flex;gap:10px}
.chips b{display:flex;align-items:center;gap:9px;padding:10px 18px;border:1px solid var(--line);border-radius:999px;background:rgba(22,26,33,.8);font-size:19px;font-weight:600;color:#dfe3ea}
.chips svg{width:18px;height:18px}
.win{position:absolute;border-radius:14px;overflow:hidden;border:1px solid #2a303b;background:#0c0e12;box-shadow:0 40px 110px rgba(0,0,0,.7)}
.win img{display:block;width:100%}
.chrome{height:30px;background:#121519;border-bottom:1px solid #1f232b;display:flex;align-items:center}
.mac .chrome{gap:7px;padding:0 12px}
.mac .chrome i{width:11px;height:11px;border-radius:50%}
.windows .chrome b{margin-left:13px;margin-right:auto;font-size:12px;font-weight:600;color:#c7ccd6}
.windows .chrome span{width:44px;text-align:center;font-size:12px;color:#8b93a1}
.mac{left:662px;top:66px;width:760px}
.windows{left:722px;top:296px;width:620px}
</style>
</head>
<body>
<div class="bg"></div><div class="grid"></div>
<div class="brand"><svg viewBox="0 0 20 20"><rect width="11" height="20" rx="2.5" fill="#e0473d"/><rect x="12" width="8" height="12" rx="2.5" fill="#e0921f"/><rect x="12" y="13" width="8" height="7" rx="2.5" fill="#3d7fe6"/></svg><span class="word">Evict<span>.</span></span></div>
<h1>The bouncer for<br>your disk<span>.</span></h1>
<p class="sub">Free disk space analyzer<br>for macOS, Windows and Linux.</p>
<div class="chips"><b>macOS</b><b>Windows</b><b>Linux</b><b>Open source</b></div>
<div class="win mac"><div class="chrome"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div><img src="screenshot.png" alt=""></div>
<div class="win windows"><div class="chrome"><b>Evict</b><span>─</span><span>☐</span><span>✕</span></div><img src="screenshot-win.png" alt=""></div>
</body>
</html>
