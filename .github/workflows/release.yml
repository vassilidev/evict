name: Release

# Push a tag like v1.2.0 (matching CFBundleShortVersionString in macos/Info.plist) to publish a release.
# With the signing secrets set, the DMG is signed with Developer ID and notarized by Apple.
# The Linux packages are published as soon as they're built. The release only becomes "latest" (what the macOS updater
# and download links use) once its DMG is attached: Apple's notarization can take hours, so a DMG Apple hasn't
# accepted after 30 minutes is kept as an artifact, and notarized.yml publishes it when Apple does.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 90
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' macos/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match app version $version"; exit 1; }

      - name: Scanner matches du
        run: ./test.sh

      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
          NOTARY_TIMEOUT: 30m
        run: ./build.sh dmg

      - name: Check the page
        run: |
          page=.build/Evict.app/Contents/Resources/index.html
          grep -q 'window.DATA = null; /\* __DATA__ \*/' "$page"
          test "$(wc -c < "$page")" -lt "$(wc -c < index.html)"  # the minifier really ran

      - name: Check the signature
        if: env.SIGNED == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 .build/Evict.app
          spctl --assess --type execute --verbose .build/Evict.app || echo "Gatekeeper assessment needs notarization"

      - name: Install from the DMG, start, quit and remove
        run: macos/smoke.sh .build/Evict.dmg

      - name: Publish the DMG
        id: publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ -f .build/notary-id ]; then
            echo "::notice::Apple is still notarizing the DMG: notarized.yml publishes it once Apple accepts it"
            echo "pending=true" >> "$GITHUB_OUTPUT"
          else
            macos/publish.sh "$GITHUB_REF_NAME" .build/Evict.dmg
          fi

      - name: Keep the DMG for notarized.yml
        if: steps.publish.outputs.pending == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: evict-dmg
          path: |
            .build/Evict.dmg
            .build/notary-id
          include-hidden-files: true
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(sed -n '/CFBundleShortVersionString/{n;s/.*<string>\(.*\)<\/string>.*/\1/p;}' macos/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match app version $version"; exit 1; }

      - name: Scanner matches du
        run: ./test.sh

      - name: Build the app and packages (Ubuntu 22.04 container, the oldest glibc supported)
        run: linux/package.sh

      - name: Install, start and uninstall on Ubuntu 24.04
        run: docker run --rm -v "$PWD:/src:ro" -w /src ubuntu:24.04 sh linux/smoke.sh ".build/evict-linux-${{ matrix.arch }}.deb"

      - uses: actions/upload-artifact@v4
        with:
          name: evict-linux-${{ matrix.arch }}
          path: .build/evict-linux-*
          include-hidden-files: true  # .build/ is a hidden folder
          if-no-files-found: error

  publish-linux:
    name: Publish the Linux packages
    needs: linux
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: evict-linux-*
          path: dist
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          tag=$GITHUB_REF_NAME
          ls -l dist
          gh release create "$tag" dist/* --title "Evict ${tag#v}" --generate-notes --latest=false \
            || gh release upload "$tag" dist/* --clobber

  # The published release, as users get it: the website's installer on every supported distribution
  verify-linux:
    needs: publish-linux
    uses: ./.github/workflows/linux-distros.yml
    with:
      version: ${{ github.ref_name }}
