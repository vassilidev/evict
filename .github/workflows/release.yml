name: Release

# Push a tag like v1.2.0 (matching CFBundleShortVersionString in app/Info.plist) to publish a release.
# With the signing secrets set, the DMG is signed with Developer ID and notarized by Apple.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  dmg:
    runs-on: macos-15
    timeout-minutes: 240
    env:
      SIGNED: ${{ secrets.DEVELOPER_ID_P12 != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Tag matches the app version
        run: |
          version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' app/Info.plist)
          test "v$version" = "$GITHUB_REF_NAME" || { echo "Tag $GITHUB_REF_NAME doesn't match app version $version"; exit 1; }

      - name: Scanner matches du
        run: ./test.sh

      - name: Import the Developer ID certificate
        if: env.SIGNED == 'true'
        env:
          DEVELOPER_ID_P12: ${{ secrets.DEVELOPER_ID_P12 }}
          DEVELOPER_ID_P12_PASSWORD: ${{ secrets.DEVELOPER_ID_P12_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(uuidgen)
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 21600 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          echo "$DEVELOPER_ID_P12" | base64 --decode > "$RUNNER_TEMP/developer-id.p12"
          security import "$RUNNER_TEMP/developer-id.p12" -k "$keychain" -P "$DEVELOPER_ID_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/developer-id.p12"

      - name: Build, sign and notarize the DMG
        env:
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_PASSWORD: ${{ secrets.NOTARY_PASSWORD }}
          NOTARY_TEAM_ID: ${{ secrets.NOTARY_TEAM_ID }}
        run: ./build.sh dmg

      - name: Check the page
        run: |
          page=.build/Evict.app/Contents/Resources/index.html
          grep -q 'window.DATA = null; /\* __DATA__ \*/' "$page"
          test "$(wc -c < "$page")" -lt "$(wc -c < index.html)"  # the minifier really ran

      - name: Check the signature
        if: env.SIGNED == 'true'
        run: |
          codesign --verify --deep --strict --verbose=2 .build/Evict.app
          spctl --assess --type execute --verbose .build/Evict.app || echo "Gatekeeper assessment needs notarization"

      - name: Publish the DMG
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            gh release upload "$GITHUB_REF_NAME" .build/Evict.dmg --clobber
          else
            gh release create "$GITHUB_REF_NAME" .build/Evict.dmg --title "Evict ${GITHUB_REF_NAME#v}" --generate-notes
          fi
