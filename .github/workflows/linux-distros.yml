name: Linux distributions

# Evict's whole life on every supported distribution, x86_64 and ARM64, each in a fresh container: the one-line
# installer installs it, the app starts on a virtual display and shows its map, then it's uninstalled and nothing may
# be left (linux/smoke.sh). CI runs it on the packages it just built; the release workflow, on the published release.
on:
  workflow_call:
    inputs:
      version:
        description: Test this published version, installed from the website, instead of this run's packages
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      version:
        description: Published version to test, e.g. 1.11.1
        required: true
        type: string

jobs:
  distro:
    name: ${{ matrix.distro.image }} ${{ matrix.distro.ext }} ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - {image: 'ubuntu:20.04', ext: deb}
          - {image: 'ubuntu:22.04', ext: deb}
          - {image: 'ubuntu:24.04', ext: deb}
          - {image: 'ubuntu:24.04', ext: tar.gz}
          - {image: 'ubuntu:26.04', ext: deb}
          - {image: 'debian:11', ext: deb}
          - {image: 'debian:12', ext: deb}
          - {image: 'debian:13', ext: deb}
          - {image: 'linuxmintd/mint20-amd64', ext: deb}
          - {image: 'linuxmintd/mint21-amd64', ext: deb}
          - {image: 'linuxmintd/mint22-amd64', ext: deb}
          - {image: 'kalilinux/kali-rolling', ext: deb}
          - {image: 'fedora:41', ext: rpm}
          - {image: 'fedora:42', ext: rpm}
          - {image: 'fedora:43', ext: rpm}
          - {image: 'opensuse/tumbleweed', ext: rpm}
          - {image: 'opensuse/leap:15.6', ext: rpm}
          - {image: 'opensuse/leap:16.0', ext: rpm}
          - {image: 'almalinux:9', ext: rpm}
          - {image: 'almalinux:10', ext: rpm}
          - {image: 'rockylinux/rockylinux:9', ext: rpm}
          - {image: 'rockylinux/rockylinux:10', ext: rpm}
          - {image: 'archlinux:latest', ext: pkg.tar.zst}
          - {image: 'manjarolinux/base', ext: pkg.tar.zst}
        exclude:  # images only published for x86_64
          - {arch: aarch64, distro: {image: 'linuxmintd/mint20-amd64', ext: deb}}
          - {arch: aarch64, distro: {image: 'linuxmintd/mint21-amd64', ext: deb}}
          - {arch: aarch64, distro: {image: 'linuxmintd/mint22-amd64', ext: deb}}
          - {arch: aarch64, distro: {image: 'archlinux:latest', ext: pkg.tar.zst}}
    steps:
      - uses: actions/checkout@v4

      - if: inputs.version == ''
        uses: actions/download-artifact@v4
        with:
          name: evict-linux-${{ matrix.arch }}
          path: .build

      - name: Install, start and uninstall
        env:
          IMAGE: ${{ matrix.distro.image }}
          VERSION: ${{ inputs.version }}
          FILE: .build/evict-linux-${{ matrix.arch }}.${{ matrix.distro.ext }}
        run: |
          if [ -n "$VERSION" ]; then
            docker run --rm -v "$PWD:/src:ro" -w /src -e EVICT_VERSION="$VERSION" "$IMAGE" sh linux/smoke.sh
          else
            docker run --rm -v "$PWD:/src:ro" -w /src "$IMAGE" sh linux/smoke.sh "$FILE"
          fi
