name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  macos:
    name: macOS
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Scanner matches du
        run: ./test.sh

      - name: Page scripts parse
        run: |
          for page in index.html docs/*.html; do
            awk '/<script>/{f=1;next}/<\/script>/{f=0}f' "$page" > "$RUNNER_TEMP/page.js"
            node --check "$RUNNER_TEMP/page.js"
          done

      - name: Build the universal app and DMG
        run: ./build.sh dmg

      - name: Check the bundle
        run: |
          for bin in Evict evict-scan; do
            lipo -archs ".build/Evict.app/Contents/MacOS/$bin" | grep -q 'x86_64 arm64'
          done
          codesign --verify --deep --strict .build/Evict.app
          page=.build/Evict.app/Contents/Resources/index.html
          grep -q 'window.DATA = null; /\* __DATA__ \*/' "$page"
          test "$(wc -c < "$page")" -lt "$(wc -c < index.html)"  # the minifier really ran

      - uses: actions/upload-artifact@v4
        with:
          name: Evict.dmg
          path: .build/Evict.dmg
          include-hidden-files: true  # .build/ is a hidden folder
          if-no-files-found: error

  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v4

      - name: Scanner matches du
        run: ./test.sh

      - name: Build the app and packages (Ubuntu 22.04 container, the oldest glibc supported)
        run: linux/package.sh

      - name: Check the packages
        run: |
          ls -l .build/evict-linux-*
          for ext in deb rpm pkg.tar.zst tar.gz; do test -s ".build/evict-linux-${{ matrix.arch }}.$ext"; done
          grep -q 'window.DATA = null; /\* __DATA__ \*/' .build/linux/evict/index.html
          test "$(wc -c < .build/linux/evict/index.html)" -lt "$(wc -c < index.html)"  # the minifier really ran

      - uses: actions/upload-artifact@v4
        with:
          name: evict-linux-${{ matrix.arch }}
          path: .build/evict-linux-*
          include-hidden-files: true  # .build/ is a hidden folder
          if-no-files-found: error

  # Install with docs/install.sh on each supported distribution and start the app on a virtual display
  distros:
    name: ${{ matrix.distro.image }} ${{ matrix.arch }}
    needs: linux
    runs-on: ${{ matrix.arch == 'aarch64' && 'ubuntu-24.04-arm' || 'ubuntu-24.04' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
        distro:
          - {image: 'ubuntu:22.04', ext: deb}
          - {image: 'ubuntu:24.04', ext: deb}
          - {image: 'ubuntu:26.04', ext: deb}
          - {image: 'debian:12', ext: deb}
          - {image: 'debian:13', ext: deb}
          - {image: 'linuxmintd/mint21-amd64', ext: deb}
          - {image: 'linuxmintd/mint22-amd64', ext: deb}
          - {image: 'kalilinux/kali-rolling', ext: deb}
          - {image: 'fedora:41', ext: rpm}
          - {image: 'fedora:42', ext: rpm}
          - {image: 'fedora:43', ext: rpm}
          - {image: 'opensuse/tumbleweed', ext: rpm}
          - {image: 'opensuse/leap:15.6', ext: rpm}
          - {image: 'opensuse/leap:16.0', ext: rpm}
          - {image: 'almalinux:10', ext: rpm}
          - {image: 'rockylinux/rockylinux:10', ext: rpm}
          - {image: 'archlinux:latest', ext: pkg.tar.zst}
          - {image: 'manjarolinux/base', ext: pkg.tar.zst}
        exclude:  # images only published for x86_64
          - {arch: aarch64, distro: {image: 'linuxmintd/mint21-amd64', ext: deb}}
          - {arch: aarch64, distro: {image: 'linuxmintd/mint22-amd64', ext: deb}}
          - {arch: aarch64, distro: {image: 'archlinux:latest', ext: pkg.tar.zst}}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: evict-linux-${{ matrix.arch }}
          path: .build

      - name: Install and run
        run: docker run --rm -v "$PWD:/src:ro" -w /src "${{ matrix.distro.image }}" sh linux/smoke.sh ".build/evict-linux-${{ matrix.arch }}.${{ matrix.distro.ext }}"
