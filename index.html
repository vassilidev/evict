<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Evict</title>
<style>
:root{--bg:#0c0e12;--panel:#15181e;--line:#252a34;--fg:#eceff4;--mut:#8b93a1;--gut:#07080b;--accent:#ff5d4f}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--fg);font:13px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text",system-ui,sans-serif;display:grid;grid-template-rows:auto 1fr auto;overflow:hidden;-webkit-font-smoothing:antialiased}
code{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace}
button{font:inherit;font-size:12px;border:1px solid var(--line);background:var(--panel);color:var(--fg);border-radius:7px;padding:4px 10px;cursor:pointer;white-space:nowrap;transition:border-color .15s,background .15s}
button:hover{border-color:#4b5363;background:#1c2028}
button.danger{color:#ff8b7e}

header{display:grid;gap:9px;padding:12px 14px 9px}
.top,.bottom{display:flex;align-items:center;gap:10px;min-width:0}
.brand{display:flex;align-items:center;gap:8px;color:inherit;text-decoration:none;font-weight:800;font-size:17px;letter-spacing:.01em;flex-shrink:0}
.brand svg{width:20px;height:20px}
.brand b span{color:var(--accent)}
#crumbs{display:flex;align-items:center;gap:2px;min-width:0;flex:0 1 auto;overflow:hidden;font-size:14.5px}
#crumbs .here{margin-left:8px;padding:1px 8px;border-radius:20px;background:#1c2028;color:#c7ccd6;font-size:12px;font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}
#crumbs a{color:var(--mut);text-decoration:none;padding:3px 7px;border-radius:6px;white-space:nowrap;transition:background .15s,color .15s}
#crumbs a:hover{background:#1c2028;color:var(--fg)}
#crumbs a:last-of-type{color:var(--fg);font-weight:650}
#crumbs i{color:#4b5363;font-style:normal}
button.icon{width:28px;height:26px;padding:0;font-size:17px;line-height:1;border-color:transparent;background:none;color:var(--mut)}
button.icon:hover{background:#1c2028;color:var(--fg)}
.search{display:flex;align-items:center;gap:10px;margin:0 auto;width:min(620px,100%);min-width:180px;height:38px;flex-shrink:1;padding:0 8px 0 13px;border:1px solid #2f3541;border-radius:11px;background:#161a21;color:#7d8595;font-size:14px;text-align:left;box-shadow:0 1px 0 rgba(255,255,255,.03) inset,0 8px 24px rgba(0,0,0,.25);transition:border-color .15s,background .15s}
.search:hover{border-color:#4b5363;background:#1a1e26;color:#a3aab7}
.search span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.search svg{width:16px;height:16px;flex-shrink:0;color:#c7ccd6}
.cats{display:flex;min-width:0}
kbd{font:600 10.5px -apple-system,BlinkMacSystemFont,system-ui,sans-serif;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:1px 5px;background:#11141a}
#status{display:flex;justify-content:space-between;gap:16px;padding:0 16px 8px;color:var(--mut);font-size:11.5px;white-space:nowrap;overflow:hidden}
#keys kbd{margin:0 5px 0 14px}
#legend{display:flex;gap:6px;flex:1;min-width:0;overflow-x:auto;scrollbar-width:none;-webkit-mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(90deg,#000 calc(100% - 28px),transparent)}
#legend::-webkit-scrollbar{display:none}
#legend button{display:flex;flex-shrink:0;align-items:center;gap:7px;border-radius:20px;padding:3px 10px 3px 8px;color:#c7ccd6}
#legend button.on{border-color:var(--fg);color:var(--fg)}
#legend i{width:9px;height:9px;border-radius:3px}
.acts{display:flex;gap:6px}
body.live .bottom,body.live .cats,body.live .top button,body.live #status{display:none}
/* Scan loader: only opacity and transform animate, so it costs the scan nothing */
.stage{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;gap:22px}
.frame{position:relative;width:440px;height:270px}
.frame i{position:absolute;border-radius:4px;opacity:0;animation:pop ease both}
@keyframes pop{0%{opacity:0;transform:scale(.6)}18%{opacity:1;transform:none}85%{opacity:1;transform:none}100%{opacity:0;transform:scale(.97)}}
.stage-info{color:var(--mut);font-variant-numeric:tabular-nums}
.stage-info b{color:var(--fg);font-weight:650}
.stage-info i{font-style:normal;margin:0 9px;color:#4b5363}
#places{display:flex;gap:6px;flex-shrink:0;margin-left:auto}
.place{display:flex;align-items:center;gap:6px;color:#c7ccd6}
.place svg{width:13px;height:13px;flex-shrink:0}
.place.on{border-color:var(--fg);color:var(--fg)}
/* Free space, always in view: a small gauge of the disk, green while there's room, then orange and red */
.free{display:flex;align-items:center;gap:8px;padding:4px 10px;border:1px solid var(--line);border-radius:7px;font-size:12px;color:#c7ccd6;white-space:nowrap;cursor:default}
.free b{color:var(--fg);font-weight:650}
.free i{width:46px;height:6px;border-radius:3px;background:#262b35;overflow:hidden}
.free i::before{content:"";display:block;height:100%;width:var(--used);border-radius:3px;background:var(--level)}
@media (max-width:900px){.free i{display:none}}
/* Duplicates panel */
.d-kinds{display:flex;flex-wrap:wrap;gap:6px;margin:0 0 14px}
.d-kinds button{border-radius:20px;padding:3px 10px;color:var(--mut)}
.d-kinds button.on{background:#e6e9ef;border-color:#e6e9ef;color:#0c0e12}
.d-sum{display:flex;align-items:center;justify-content:space-between;gap:10px;margin:0 0 12px;color:var(--mut)}
.d-sum b{color:var(--fg)}
.dg{border:1px solid var(--line);border-radius:10px;margin:0 0 10px;overflow:hidden}
.dg-h{display:flex;align-items:center;gap:10px;padding:9px 12px;background:#171b22}
.dg-h div{flex:1;min-width:0}
.dg-h b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dg-h span{color:var(--mut);font-size:12px}
.dg-r{display:flex;align-items:center;gap:8px;padding:6px 12px;border-top:1px solid var(--line);font-size:12px}
.dg-r code{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tag{flex-shrink:0;font-size:11px;color:var(--mut);border:1px solid var(--line);border-radius:5px;padding:0 5px}
.tag.keep{color:#7ad9a6;border-color:#24503a}
/* Search palette: the map blurs behind it, results are cards whose top edge measures their size */
#palette{position:fixed;inset:0;z-index:14;display:flex;justify-content:center;align-items:flex-start;padding-top:max(8vh,60px);background:rgba(6,7,10,.5);-webkit-backdrop-filter:blur(16px) saturate(1.3);backdrop-filter:blur(16px) saturate(1.3);animation:fadein .16s ease-out}
@keyframes fadein{from{opacity:0}}
.pal{width:min(1040px,94vw);max-height:82vh;display:flex;flex-direction:column;background:rgba(19,22,28,.95);border:1px solid #2e3440;border-radius:16px;box-shadow:0 30px 80px rgba(0,0,0,.6);overflow:hidden}
.pal-in{display:flex;align-items:center;gap:12px;padding:15px 18px;border-bottom:1px solid var(--line)}
.pal-in svg{width:18px;height:18px;color:var(--mut);flex-shrink:0}
#q{flex:1;min-width:0;font:inherit;font-size:18px;background:none;border:0;outline:none;color:var(--fg)}
#q::placeholder{color:#5d6574}
#q::-webkit-search-cancel-button{display:none}
#pal-types{display:flex;gap:6px;padding:10px 18px 4px;overflow-x:auto;scrollbar-width:none;flex-shrink:0}
#pal-types::-webkit-scrollbar{display:none}
#pal-types button{flex-shrink:0;border-radius:20px;padding:3px 10px;color:var(--mut)}
#pal-types button b{color:var(--fg);font-weight:650;margin-right:5px}
#pal-types button.on{background:#e6e9ef;border-color:#e6e9ef;color:#3a404c}
#pal-types button.on b{color:#0c0e12}
#pal-head{display:flex;align-items:center;gap:10px;min-height:34px;padding:6px 18px;color:var(--mut);font-size:12px;flex-shrink:0}
#pal-res{overflow:auto;padding:2px 18px 16px;display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:max-content;gap:10px;align-content:start}
.card{position:relative;display:grid;gap:4px;padding:13px 12px 11px;border:1px solid #242934;border-radius:10px;background:#161a21;cursor:pointer;overflow:hidden;transition:border-color .12s,background .12s}
.card::before{content:"";position:absolute;left:0;top:0;height:3px;width:var(--w);background:var(--c)}
.card.act{border-color:#4b5363;background:#1b2029}
.card.sel{border-color:#3d7fe6;background:#18223a}
.card.sel .ck{background:#3d7fe6;border-color:#3d7fe6}
.card.sel .ck::after{content:"";width:7px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.card:hover .ck{border-color:#8b93a1}
.c-top{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:8px}
.c-ext{font-size:11.5px;font-weight:650;color:var(--c);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-size{font-weight:700;font-size:15px;font-variant-numeric:tabular-nums}
.c-name{font-weight:650;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.c-path{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pal-keys{display:flex;flex-wrap:wrap;gap:4px 16px;padding:10px 18px;border-top:1px solid var(--line);color:var(--mut);font-size:11.5px;flex-shrink:0}
.pal-keys kbd{margin-right:5px}
.pal-empty{grid-column:1/-1;color:var(--mut);padding:24px 0}
.seg{display:flex;flex-shrink:0;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg button{border:0;border-radius:0;background:none;color:var(--mut);padding:4px 12px}
.seg button.on{background:#262b35;color:var(--fg)}

#list{overflow:auto;margin:0 8px 8px;border-radius:8px;background:var(--gut);padding:4px 0}
.row{position:relative;display:grid;grid-template-columns:16px auto 10px minmax(0,1fr) 84px 56px 26px;align-items:center;gap:10px;height:36px;margin:0 4px;padding:0 8px 0 10px;border-radius:6px;cursor:pointer;user-select:none;-webkit-user-select:none;transition:background .12s,opacity .2s}
.row:hover{background:#171b22}
/* The row's size as a bar behind it, in its category color */
.row::before{content:"";position:absolute;left:0;top:3px;bottom:3px;width:var(--w,0);border-radius:6px;background:var(--c);opacity:.2;pointer-events:none}
.row>*{position:relative}
.row.dim{opacity:.25}
.tw{display:grid;place-items:center;width:12px;margin-left:calc(var(--d,0) * 20px);transition:transform .15s}
.ck{width:15px;height:15px;border-radius:4px;border:1.5px solid #3a404c;display:grid;place-items:center;transition:border-color .12s,background .12s}
.row:hover .ck{border-color:#8b93a1}
.row.sel{background:#18223a}
.row.sel .ck{background:#3d7fe6;border-color:#3d7fe6}
.row.sel .ck::after{content:"";width:7px;height:4px;border:solid #fff;border-width:0 0 2px 2px;transform:translateY(-1px) rotate(-45deg)}
.box.sel::after{content:"";position:absolute;inset:0;z-index:4;box-shadow:inset 0 0 0 3px #3d7fe6;background:rgba(61,127,230,.22);pointer-events:none}
.selall{margin-left:10px;padding:1px 8px;font-size:11.5px}
/* The selection bar sits over the toolbar, where eyes already are, and above the search palette */
#selbar{position:fixed;left:50%;top:8px;transform:translateX(-50%);z-index:16;display:flex;align-items:center;gap:8px;padding:8px;background:rgba(21,24,30,.97);backdrop-filter:blur(10px);border:1px solid #3d7fe6;border-radius:12px;box-shadow:0 14px 40px rgba(0,0,0,.5);animation:drop .18s ease-out}
@keyframes drop{from{transform:translate(-50%,-10px);opacity:0}}
#ai:not([hidden])~#selbar{left:calc((100vw - 10px - min(540px,100vw - 20px)) / 2)}
#sel-info{border:0;background:none;font-weight:650;font-size:13px}
#sel-info:hover{background:#232834}
/* Stats view: cards on the gutter. Bars start at zero; the history is a line, so a small change still shows */
#dash{overflow:auto;margin:0 8px 8px;padding:12px;border-radius:8px;background:var(--gut);display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-content:start}
.dc{min-width:0;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.dc.wide,.tiles{grid-column:1/-1}
.dc h3{display:flex;align-items:center;gap:10px;min-height:26px;margin:0 0 8px;font-size:13.5px;font-weight:650}
.dc h3 small{flex:1;color:var(--mut);font-size:12px;font-weight:500}
.dc>p{margin:0 0 10px;color:var(--mut)}
.dc h3 select{margin-left:auto}
.dc select{font:inherit;font-size:12px;color:var(--fg);background:#1c2028;border:1px solid var(--line);border-radius:7px;padding:3px 6px}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.tile{min-width:0;padding:12px 16px;border:1px solid var(--line);border-radius:12px;background:var(--panel)}
.tile span,.tile small{display:block;color:var(--mut);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tile b{display:block;margin:3px 0 2px;font-size:24px;font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.split{display:flex;gap:2px;height:18px;margin:6px 0 14px}
.split i{min-width:2px;background:var(--c)}
.split i:first-child{border-radius:4px 0 0 4px}
.split i:last-child{border-radius:0 4px 4px 0}
.split i.void,.st-r.k i.void{box-shadow:inset 0 0 0 1px #4b5363}
.cats-k{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:2px 18px}
.st-r{display:grid;grid-template-columns:104px minmax(0,1fr) 62px 74px;align-items:center;gap:10px;width:100%;padding:5px 6px;border:0;border-radius:6px;background:none;font-size:12.5px;text-align:left}
.st-r.k{grid-template-columns:10px minmax(0,1fr) auto 46px}
.st-r.ch{grid-template-columns:minmax(0,1.5fr) minmax(0,1fr) 72px}
button.st-r:hover{background:#1c2028}
.st-r code,.st-r em{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-style:normal}
.st-r em small{margin-left:8px;color:var(--mut);font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace}
.st-r i{width:var(--w);min-width:2px;height:8px;border-radius:0 4px 4px 0;background:var(--c)}
.st-r.k i{width:10px;height:10px;border-radius:3px}
.st-r b{text-align:right;font-weight:650;font-variant-numeric:tabular-nums}
.st-r span{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.hist{position:relative;height:170px;margin:4px 0 2px}
.hist svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.hist text{fill:var(--mut);font-size:11px;font-variant-numeric:tabular-nums}
.hist circle{fill:var(--panel);stroke:#c7ccd6;stroke-width:2}
.hist circle:hover{fill:#c7ccd6}
.empty-h{display:grid;place-items:center;height:84px;padding:0 16px;color:var(--mut);text-align:center;border:1px dashed var(--line);border-radius:10px}
.sched{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px;color:var(--mut);font-size:12px}
.sched .err{color:#ff8b7e}
@media (max-width:900px){#dash{grid-template-columns:minmax(0,1fr)}.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
.tw.dir::before{content:"";width:6px;height:6px;border:solid #8b93a1;border-width:0 1.5px 1.5px 0;transform:rotate(-45deg)}
.row.open .tw{transform:rotate(90deg)}
.dot{width:10px;height:10px;border-radius:3px}
.rn{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:600}
.rn small{font:11.5px ui-monospace,SFMono-Regular,Menlo,monospace;color:var(--mut);margin-left:10px}
.rs{text-align:right;font-size:13.5px;font-weight:700;font-variant-numeric:tabular-nums}
.rp{text-align:right;color:var(--mut);font-variant-numeric:tabular-nums}
.row .more{opacity:0;border:0;background:none;padding:0;color:var(--mut);font-size:16px;line-height:1}
.row:hover .more{opacity:1}
.found{animation:found 1.8s ease-out}
@keyframes found{0%,40%{box-shadow:inset 0 0 0 2px #fff}100%{box-shadow:inset 0 0 0 2px transparent}}

#map{position:relative;overflow:hidden;background:var(--gut);margin:0 8px 8px;border-radius:8px}
.box{position:absolute;overflow:hidden;cursor:pointer;color:#fff;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.12;transition:opacity .2s ease}
.box.group{display:block;background:#171a21}
/* One ring glides to the hovered box, a fainter one frames its parent folder */
.ring{position:absolute;left:0;top:0;pointer-events:none;opacity:0;transition:transform .1s cubic-bezier(.2,.8,.2,1),width .1s cubic-bezier(.2,.8,.2,1),height .1s cubic-bezier(.2,.8,.2,1),opacity .12s ease}
#ring{z-index:6;border-radius:3px;background:rgba(255,255,255,.09);box-shadow:inset 0 0 0 2px #fff,0 0 0 1px rgba(0,0,0,.5),0 6px 22px rgba(0,0,0,.45)}
#ring2{z-index:5;border-radius:3px;box-shadow:inset 0 0 0 1px rgba(255,255,255,.5)}
.hd{height:17px;padding:2px 6px 0;display:flex;justify-content:space-between;gap:8px;font-size:10.5px;font-weight:700;color:#9aa2b1;text-transform:uppercase;letter-spacing:.04em;white-space:nowrap;transition:color .14s}
.box.group:hover>.hd{color:#fff}
.hd span{overflow:hidden;text-overflow:ellipsis}
.hd b{font-weight:600;color:#6b7383}
.nm{font-weight:700;max-width:100%;padding:0 5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-shadow:0 1px 2px rgba(0,0,0,.3)}
.nm.wrap{white-space:normal;overflow-wrap:anywhere;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.sz{opacity:.82;margin-top:2px;font-weight:500;font-variant-numeric:tabular-nums}
.box.dim{opacity:.15}
.c-hidden{background:repeating-linear-gradient(45deg,#181b22 0 6px,#1e2129 6px 12px)!important;color:#7d8595}

.pop{position:fixed;left:0;top:0;z-index:10;background:rgba(21,24,30,.96);backdrop-filter:blur(8px);border:1px solid #2e3440;border-radius:10px;box-shadow:0 10px 30px rgba(0,0,0,.45);max-width:440px}
#tip{pointer-events:none;padding:10px 12px;display:grid;gap:5px;opacity:0;transition:opacity .12s ease}
#tip.on{opacity:1}
#tip .t-name{font-weight:700;font-size:14px;overflow-wrap:anywhere}
#tip .t-meta{display:flex;align-items:center;gap:7px;color:#c7ccd6}
#tip .t-meta i{width:9px;height:9px;border-radius:3px}
#tip code{color:var(--mut);overflow-wrap:anywhere}
.hint{color:#6b7383;font-size:11px;padding-top:4px;border-top:1px solid var(--line);margin-top:2px}
#menu{padding:5px;min-width:240px;max-height:70vh;overflow:auto;z-index:17}
#menu .m-head{padding:7px 10px 8px;border-bottom:1px solid var(--line);margin-bottom:4px}
#menu .m-head b{display:block;overflow-wrap:anywhere}
#menu .m-head span{color:var(--mut);font-size:12px}
#menu button{display:block;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:6px;font-size:13px;white-space:normal;overflow-wrap:anywhere}
#menu button:hover{background:#232834}
#menu .m-note{padding:7px 10px;color:var(--mut);font-size:12px}
#menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
#ai{position:fixed;top:10px;right:10px;bottom:10px;z-index:15;width:min(540px,calc(100vw - 20px));display:flex;flex-direction:column;background:rgba(21,24,30,.97);backdrop-filter:blur(10px);border:1px solid #2e3440;border-radius:14px;box-shadow:0 20px 60px rgba(0,0,0,.55);animation:slide .22s cubic-bezier(.2,.8,.2,1)}
@keyframes slide{from{transform:translateX(24px);opacity:0}}
.a-head{display:grid;grid-template-columns:1fr auto;gap:3px 12px;padding:16px 18px 14px;border-bottom:1px solid var(--line)}
.a-kicker{font-size:11px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:#e08a6b}
#ai h3{margin:0;font-size:17px;overflow-wrap:anywhere}
#ai-path{color:var(--mut);overflow-wrap:anywhere}
#ai-close{grid-column:2;grid-row:1/4;align-self:start;width:28px;height:28px;padding:0;border-radius:8px}
#ai-body{flex:1;overflow:auto;padding:16px 18px;line-height:1.6;color:#d7dbe3;font-size:13.5px}
.a-foot{display:flex;align-items:center;gap:8px;padding:12px 18px;border-top:1px solid var(--line)}
#ai-status{flex:1;color:var(--mut);font-size:12px;font-variant-numeric:tabular-nums}
.a-wait{display:flex;align-items:center;gap:10px;color:#c7ccd6;margin-bottom:16px}
.spin{width:16px;height:16px;border-radius:50%;border:2px solid #3a404c;border-top-color:#e08a6b;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

window.DATA = null; /* __DATA__ */
</script>
<script>
const D = window.DATA, $ = id => document.getElementById(id), OS = (D || window.LIVE)?.os, LINUX = OS === 'linux', WIN = OS === 'win';
// Windows: "/" is every fixed drive, "/C:" one drive alone
const DISK = WIN ? (!D || D.tree[0] === '/' ? 'This PC' : `Local Disk (${D.tree[0].slice(1)})`) : LINUX ? 'Computer' : 'Macintosh HD', TRASH = WIN ? 'Recycle Bin' : 'Trash';
if (!D && !window.LIVE) document.body.innerHTML = '<p id="empty">No data: run <code>./evict</code> to scan the disk and generate this page.</p>';

const CATS = {
  junk:   ['Regenerable', '#e0473d'],
  arch:   ['Archives & disk images', '#e0921f'],
  media:  ['Media', '#9061f0'],
  app:    ['Applications', '#3d7fe6'],
  data:   ['Data', '#2ea36b'],
  sys:    ['System', '#5f6675'],
  misc:   ['Small files', '#394050'],
  hidden: ['Invisible', '#2a2e37'],
};
const JUNK = /^(\$Recycle\.Bin|CrashDumps|INetCache|D3DSCache|node_modules|site-packages|bower_components|\.tox|\.bundle|\.cargo|DerivedData|Caches?|\.cache|\.npm|\.yarn|\.pnpm-store|\.gradle|\.m2|\.next|\.nuxt|\.turbo|\.parcel-cache|\.expo|\.svelte-kit|dist|build|target|__pycache__|\.venv|venv|vendor|Pods|\.Trash|CoreSimulator|\.terraform|tmp|temp|Logs?)$/i;
const ARCH = /\.(zip|dmg|iso|pkg|msi|msix|appx|cab|vhdx?|wim|esd|tar|gz|tgz|bz2|xz|7z|rar|xip|raw|img|qcow2|vmdk|vdi|ipsw|sparseimage|sparsebundle|bak)$/i;
const MEDIA = /\.(mov|mp4|m4v|mkv|avi|webm|jpe?g|png|heic|gif|tiff?|psd|cr2|nef|arw|dng|mp3|wav|aiff?|flac|m4a|aac|photoslibrary|fcpbundle|imovielibrary|logicx|band)$/i;
const SYS = /^\/(System|private|usr|bin|sbin|cores|proc|sys|dev|run|boot|etc|lib|lib32|lib64|libx32|snap)(\/|$)|^\/[A-Z]:\/(Windows(\.old)?|System Volume Information|Recovery|Boot|EFI|PerfLogs|Config\.Msi|\$(?!Recycle\.Bin)[^/]*|pagefile\.sys|hiberfil\.sys|swapfile\.sys)(\/|$)/;
// Home folders: /Users/name on macOS, /home/name and /root on Linux, C:\Users\name on Windows (/C:/Users/name in the report)
const HOME = String.raw`(?:\/(?:Users|home)\/[^/]+|\/root|\/[A-Z]:\/Users\/[^/]+)`;

const nf = (v, d) => new Intl.NumberFormat('en-US', {maximumFractionDigits: d}).format(v);
const fmt = b => { const u = ['B', 'KB', 'MB', 'GB', 'TB']; let i = 0; while (b >= 1000 && i < 4) { b /= 1000; i++ } return nf(b, i && b < 10 ? 1 : 0) + ' ' + u[i] };
const isDir = n => n[0] !== null && Array.isArray(n[2]);
const join = (p, name) => p === '/' ? '/' + name : p + '/' + name;
const kidPath = (p, k) => k[0] === null || k.cat ? null : join(p, k[0]);
const quote = p => "'" + p.replace(/'/g, "'\\''") + "'";
// Never offer rm on the disk root, top-level folders, home folders, system paths or where keys and passwords live
const SECRETS = new RegExp(String.raw`^${HOME}\/(\.ssh|\.gnupg|\.aws|\.azure|\.kube|\.password-store|\.config\/gcloud|Library\/Keychains|\.local\/share\/keyrings|AppData\/Roaming\/gnupg|AppData\/(Roaming|Local)\/Microsoft\/(Credentials|Protect|Crypto|SystemCertificates|Vault))(\/|$)`);
const HOMES = new RegExp(String.raw`^${HOME}(\/Library|\/\.Trash|\/\.config|\/\.local|\/\.local\/share|\/\.local\/share\/Trash(\/files)?|\/AppData(\/(Local|Roaming|LocalLow|Local\/Temp))?)?$`);
// A drive is one level deeper on Windows (/C:/Users), and a user's whole Recycle Bin stays
const canRm = p => !!p && p.split('/').length > (WIN ? 3 : 2) && !SYS.test(p) && !SECRETS.test(p) && !HOMES.test(p) && !/^\/[A-Z]:\/\$Recycle\.Bin\/[^/]+$/.test(p);
// Windows paths in the report look like /C:/Users/me; people read C:\Users\me
const show = p => !WIN ? p : p === '/' ? DISK : p.slice(1).replace(/\//g, '\\') + (/^\/[A-Z]:$/.test(p) ? '\\' : '');
const el = (tag, cls, text) => { const e = document.createElement(tag); if (cls) e.className = cls; if (text != null) e.textContent = text; return e };
const label = n => n[0] ?? `${nf(n[2], 0)} other items`;
const extOf = name => (name.match(/^.+\.([^.\s]+)$/)?.[1] || '').toLowerCase();
const ARCHIVE = /\.(zip|rar|7z|tar|tgz|tbz2?|txz|tar\.(gz|bz2|xz|zst)|iso|xip|cpio|xar|jar|apk|ipa|cbz|cbr)$/i;
const BUNDLE = /\.(app|photoslibrary|fcpbundle|imovielibrary|logicx|band|xcarchive|sparsebundle)$/i;
const pct = x => x * 100 < 0.1 ? '<0.1%' : nf(x * 100, 1) + '%';
const esc = s => s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');

// Minimal Markdown for Claude's answers; paths in backticks become clickable
function inlineMd(s) {
  const codes = [];
  return esc(s.replace(/`([^`]+)`/g, (_, c) => `\u0000${codes.push(c) - 1}\u0000`))
    .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>').replace(/(^|[^\w*])\*(?!\s)(.+?)\*(?!\w)/g, '$1<em>$2</em>').replace(/\[([^\]]+)\]\([^)]*\)/g, '$1')
    .replace(/\u0000(\d+)\u0000/g, (_, i) => `<code${/^(~[\/\\]|\/|[A-Za-z]:\\)/.test(codes[i]) ? ' class="path" title="Show in Evict"' : ''}>${esc(codes[i])}</code>`);
}
function md(src) {
  const out = [];
  let list = null, para = [], code = null, table = null;
  const close = () => {
    if (para.length) out.push(`<p>${para.map(inlineMd).join('<br>')}</p>`);
    if (list) out.push(`</${list}>`);
    if (table) out.push(`<table>${table.map((cells, r) => `<tr>${cells.map(c => r ? `<td>${inlineMd(c)}</td>` : `<th>${inlineMd(c)}</th>`).join('')}</tr>`).join('')}</table>`);
    para = []; list = null; table = null;
  };
  for (const line of src.split('\n')) {
    let m;
    if (code) { if (/^\s*```/.test(line)) { out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`); code = null } else code.push(line); continue }
    if (/^\s*```/.test(line)) { close(); code = []; continue }
    if ((m = line.match(/^\s*\|(.*)\|\s*$/))) {
      if (!table) { close(); table = [] }
      if (!/^[\s|:-]+$/.test(m[1])) table.push(m[1].split('|').map(c => c.trim()));
      continue;
    }
    if (table) close();
    if ((m = line.match(/^(#{1,6})\s+(.*)/))) { close(); const h = Math.min(4, m[1].length + 1); out.push(`<h${h}>${inlineMd(m[2])}</h${h}>`); continue }
    if (/^\s*([-*_])(\s*\1){2,}\s*$/.test(line)) { close(); out.push('<hr>'); continue }
    if ((m = line.match(/^(\s*)([-*+]|\d+[.)])\s+(.*)/))) {
      const item = inlineMd(m[3]), last = out.length - 1;
      // One level of nesting: an indented item goes inside the previous one
      if (list && m[1].length >= 2) {
        out[last] = out[last].endsWith('</ul></li>') ? out[last].replace(/<\/ul><\/li>$/, `<li>${item}</li></ul></li>`) : out[last].replace(/<\/li>$/, `<ul><li>${item}</li></ul></li>`);
        continue;
      }
      const t = /\d/.test(m[2]) ? 'ol' : 'ul';
      if (list !== t) { close(); out.push(t === 'ol' ? `<ol start="${parseInt(m[2])}">` : '<ul>'); list = t }
      out.push(`<li>${item}</li>`);
      continue;
    }
    if (!line.trim()) { if (!list) close(); continue }
    if (list && /^\s+\S/.test(line)) { out[out.length - 1] = out.at(-1).replace(/<\/li>$/, ' ' + inlineMd(line.trim()) + '</li>'); continue }
    if (list) close();
    para.push(line);
  }
  if (code) out.push(`<pre><code>${esc(code.join('\n'))}</code></pre>`);
  close();
  return out.join('');
}

function catOf(n, p) {
  if (n.cat) return n.cat;
  if (n[0] === null) return 'misc';
  if (SYS.test(p)) return 'sys';
  if (JUNK.test(n[0])) return 'junk';
  if (/\.(app|appimage)$/i.test(n[0]) || LINUX && /^\/(opt|var\/lib\/(flatpak|snapd))\//.test(p)
    || WIN && /^\/[A-Z]:\/(Program Files( \(x86\))?|Users\/[^/]+\/AppData\/Local\/Programs)\//.test(p)) return 'app';
  if (ARCH.test(n[0])) return 'arch';
  if (MEDIA.test(n[0])) return 'media';
  return isDir(n) ? null : 'data';
}

// Squarified treemap (Bruls et al.): grow a row while its worst aspect ratio improves, then lay it out
function squarify(items, x, y, w, h) {
  const out = [], total = items.reduce((s, it) => s + it.v, 0);
  if (total <= 0 || w <= 0 || h <= 0) return out;
  const k = w * h / total;
  const worst = (sum, min, max, side) => Math.max(side * side * max / (sum * sum), sum * sum / (side * side * min));
  let row = [], sum = 0;
  const place = () => {
    if (w >= h) {
      const cw = sum / h; let cy = y;
      for (const it of row) { const rh = it.v * k / cw; out.push([it, x, cy, cw, rh]); cy += rh }
      x += cw; w -= cw;
    } else {
      const rh = sum / w; let cx = x;
      for (const it of row) { const rw = it.v * k / rh; out.push([it, cx, y, rw, rh]); cx += rw }
      y += rh; h -= rh;
    }
    row = []; sum = 0;
  };
  for (let i = 0; i < items.length;) {
    const a = items[i].v * k, side = Math.min(w, h);
    if (!row.length || worst(sum + a, a, row[0].v * k, side) <= worst(sum, row.at(-1).v * k, row[0].v * k, side)) { row.push(items[i++]); sum += a }
    else place();
  }
  if (row.length) place();
  return out;
}

// While the app scans: blocks that build up and dissolve in a loop (decorative), and the real item count
function live() {
  const base = window.LIVE.root, frame = el('div', 'frame'), info = el('div', 'stage-info', 'Starting…'), stage = el('div', 'stage');
  const colors = ['junk', 'arch', 'media', 'app', 'data', 'sys', 'misc'].map(c => CATS[c][1]), cycle = 2600;
  document.body.classList.add('live');
  $('crumbs').textContent = base === '/' ? `Scanning ${DISK}…` : `Scanning ${base}…`;
  stage.append(frame, info);
  $('map').append(stage);
  function build() {
    const items = Array.from({length: 7 + Math.random() * 8 | 0}, () => ({v: Math.random() ** 2 + .05})).sort((a, b) => b.v - a.v);
    frame.replaceChildren(...squarify(items, 0, 0, 440, 270).map(([, x, y, w, h], i) => {
      const b = el('i'), delay = i * 90;
      b.style.cssText = `left:${x + 1}px;top:${y + 1}px;width:${w - 2}px;height:${h - 2}px;background:${colors[Math.random() * colors.length | 0]};animation-delay:${delay}ms;animation-duration:${cycle - delay}ms`;
      return b;
    }));
  }
  build();
  setInterval(build, cycle);
  // Items per second between two progress lines, smoothed so the figure doesn't jump around
  const t0 = performance.now();
  let last = null, rate = 0;
  window.evictLive = snap => {
    const now = performance.now(), secs = (now - t0) / 1000;
    if (last && now > last.t) {
      const r = (snap.count - last.count) / ((now - last.t) / 1000);
      rate = rate ? rate * .6 + r * .4 : r;
    }
    last = {t: now, count: snap.count};
    const time = secs < 60 ? `${nf(secs, 0)} s` : `${Math.floor(secs / 60)} min ${String(Math.floor(secs % 60)).padStart(2, '0')} s`;
    info.innerHTML = [`<b>${nf(snap.count, 0)}</b> items`, `<b>${fmt(snap.bytes)}</b>`, `<b>${time}</b>`, `<b>${nf(rate, 0)}</b> items/s`].join('<i>·</i>');
  };
}
if (!D && window.LIVE) live();

if (D) {
  const root = D.tree, isDisk = root[0] === '/' || WIN && /^\/[A-Z]:$/.test(root[0]);
  // Inside the app (macOS or Linux), deletion and clipboard go through the native bridge
  const app = window.webkit?.messageHandlers?.evict;
  const SHOW = WIN ? 'Show in Explorer' : LINUX ? 'Show in folder' : 'Show in Finder', SYSTEM = WIN ? 'Windows' : LINUX ? 'Linux' : 'macOS';
  const MACHINE = WIN ? 'Windows PC' : LINUX ? 'Linux computer' : 'Mac';
  if (LINUX || WIN) {
    for (const k of document.querySelectorAll('kbd')) k.textContent = k.textContent.replace('⌘', 'Ctrl+').replace(/\+$/, '');
    for (const e of document.querySelectorAll('.pal-keys span, #sel-finder')) e.lastChild.textContent = e.lastChild.textContent.replace('Show in Finder', SHOW);
    $('search').title = 'Search (Ctrl+K)';
  }
  const stats = () => {
    $('stats').textContent = (isDisk ? `${fmt(D.total - D.free)} used · ${fmt(D.free)} free · ` : `${fmt(root[1])} · `)
      + `${nf(D.count, 0)} items in ${nf(D.secs, 1)} s`;
  };
  stats();
  $('stats').title = `Scanned on ${D.date}`;

  // Space the scan couldn't see; free space only shows in the stats, a box of nothing helps no one
  const extra = [], hidden = isDisk ? D.total - D.free - root[1] : 0;
  if (hidden > 0) extra.push(Object.assign([WIN ? 'Not visible to the scan (system files, restore points, protected folders)' : 'Not visible to the scan (snapshots, protected files)', hidden], {cat: 'hidden'}));

  // Folders the user chose to hide from the map, remembered across scans
  let masked;
  try { masked = new Set(JSON.parse(localStorage.getItem('evict.masked') || '[]')) } catch { masked = new Set() }
  const saveMasked = () => { try { localStorage.setItem('evict.masked', JSON.stringify([...masked])) } catch {} };

  // Visible size (hidden folders excluded) and bytes per category, memoized until the tree or the mask changes
  let totals = new Map(), mixes = new Map();
  let downloads = null, extStats = null;
  const resetMemo = () => { totals = new Map(); mixes = new Map(); downloads = extStats = null };
  function total(n, p) {
    if (n.cat || !isDir(n)) return p && masked.has(p) ? 0 : n[1];
    if (masked.has(p)) return 0;
    let t = totals.get(n);
    if (t === undefined) { t = 0; for (const k of n[2]) t += total(k, kidPath(p, k)); totals.set(n, t) }
    return t;
  }
  function mix(n, p) {
    let m = mixes.get(n);
    if (m) return m;
    m = {};
    const t = total(n, p), c = catOf(n, p);
    if (t > 0) {
      if (c) m[c] = t;
      else for (const k of n[2]) for (const [kc, v] of Object.entries(mix(k, kidPath(p, k)))) m[kc] = (m[kc] || 0) + v;
    }
    mixes.set(n, m);
    return m;
  }
  const dominant = (n, p) => Object.entries(mix(n, p)).sort((a, b) => b[1] - a[1])[0]?.[0] || 'misc';

  let stack, cur, curPath, viewSize, boxes = [], hovered = null, focusCat = null, tipW = 0, tipH = 0;
  const ring = el('div', 'ring'), ring2 = el('div', 'ring');
  ring.id = 'ring'; ring2.id = 'ring2';
  const pathOf = s => s.slice(1).reduce((p, n) => join(p, n[0]), root[0]);
  function resolve(path) {
    const s = [root];
    if (!path.startsWith(root[0])) return s;
    for (const part of path.slice(root[0].length).split('/').filter(Boolean)) {
      const n = s.at(-1)[2].find(k => k[0] === part && isDir(k));
      if (!n) break;
      s.push(n);
    }
    return s;

    for (const p of new Set([...was.keys(), ...now.keys()])) {
      const d = (now.get(p) || 0) - (was.get(p) || 0);
      if ((p === base || under(p, base)) && Math.abs(d) >= 1e9) out.push({p, d});
    }
    return out.filter(x => !out.some(y => under(y.p, x.p))).sort((x, y) => Math.abs(y.d) - Math.abs(x.d)).slice(0, 8);
  }
  const ago = days => days < 14 ? `${Math.max(1, Math.round(days))} days` : days < 60 ? `${Math.round(days / 7)} weeks` : days < 730 ? `${Math.round(days / 30)} months` : `${nf(days / 365, 0)} years`;
  function renderDash() {
    const dash = $('dash'), scroll = dash.scrollTop, atRoot = stack.length === 1, disk = isDisk && atRoot, size = total(cur, curPath);
    const stats = atRoot ? (extStats ??= fileStats()) : fileStats(cur, curPath), m = {...mix(cur, curPath)};
    if (atRoot) for (const e of extra) m[e.cat] = e[1];
    const files = stats.sizes.reduce((sum, s) => sum + s[1], 0), used = D.total - D.free;
    const card = (title, sub, wide) => {
      const c = el('section', 'dc' + (wide ? ' wide' : '')), h = el('h3', '', title);
      h.append(el('small', '', sub || ''));
      c.append(h);
      return c;
    };
    const tile = (label, value, note) => { const t = el('div', 'tile'); t.append(el('span', '', label), el('b', '', value), el('small', '', note)); return t };
    // This folder in each scan: the disk's used space, or the folder's size when the scan kept it (500 MB or more)
    const hist = (D.history || []).map(h => ({d: h.d, v: curPath === root[0] ? (isDisk ? h.total - h.free : h.size) : h.dirs?.find(([q]) => q === curPath)?.[1]}))
      .filter(x => x.v != null);
    const prev = hist.at(-2), last = hist.at(-1);

    const tiles = el('div', 'tiles');
    if (disk) tiles.append(tile('Used', fmt(used), `${pct(used / D.total)} of ${fmt(D.total)}`),
      tile('Free', fmt(D.free), used / D.total > .95 ? 'Almost full' : used / D.total > .85 ? 'Getting full' : 'Room to spare'));
    else tiles.append(tile('Size', fmt(size), atRoot ? `${nf(D.count, 0)} items scanned` : isDisk ? `${pct(size / used)} of the used space` : `${pct(size / total(root, root[0]))} of the scan`),
      tile('Files of 1 MB or more', nf(files, 0), fmt(stats.sizes.reduce((sum, s) => sum + s[0], 0))));
    tiles.append(tile('Regenerable', fmt(m.junk || 0), 'Caches and builds that come back on their own'),
      prev ? tile('Since the scan before', delta(prev.v, last.v), prev.d) : tile('Scans', nf(hist.length, 0), hist.length ? 'Each scan adds a point to the chart' : 'Folders under 500 MB aren’t followed'));

    // Where the space goes: one bar split by category (and free space, on the disk)
    const space = card('Where the space goes', disk ? `${fmt(D.total)} disk` : fmt(size), true), split = el('div', 'split'), keys = el('div', 'cats-k');
    const whole = disk ? D.total : Object.values(m).reduce((sum, v) => sum + v, 0) || 1;
    const parts = Object.keys(CATS).filter(c => m[c] > 0).sort((a, b) => m[b] - m[a]).map(c => [c, CATS[c][0], m[c], CATS[c][1]]);
    if (disk && D.free > 0) parts.push([null, 'Free', D.free, 'transparent']);
    for (const [c, name, v, color] of parts) {
      const seg = el('i', c ? '' : 'void'), dot = el('i', c ? '' : 'void'), r = el(c ? 'button' : 'div', 'st-r k');
      seg.style.cssText = `flex:${v};--c:${color}`;
      seg.title = `${name}: ${fmt(v)}`;
      split.append(seg);
      dot.style.background = color;
      r.append(dot, el('em', '', name), el('b', '', fmt(v)), el('span', '', pct(v / whole)));
      if (c) { r.title = 'Highlight on the map'; r.onclick = () => { focusCat = c; view = 'map'; render(true) } }
      keys.append(r);
    }
    space.append(split, keys);

    // Scan after scan
    const over = card(disk ? 'Used space, scan after scan' : 'Size, scan after scan', prev ? `${delta(prev.v, last.v)} since ${prev.d} · ${delta(hist[0].v, last.v)} since ${dateOf(hist[0].d)}` : '', true);
    over.append(hist.length > 1 ? historyChart(hist.slice(-90))
      : el('div', 'empty-h', hist.length ? `${fmt(last.v)} today. Each scan adds a point here, so the next one draws the line.` : 'Folders under 500 MB aren’t followed from scan to scan.'));
    // At the pace of the last month of scans, when the disk is full
    const pts = hist.slice(-30).map(x => [Date.parse(x.d.replace(' ', 'T')) / 864e5, x.v]), span = pts.length > 2 ? pts.at(-1)[0] - pts[0][0] : 0;
    if (disk && span >= 3) {
      const mx = pts.reduce((sum, p) => sum + p[0], 0) / pts.length, my = pts.reduce((sum, p) => sum + p[1], 0) / pts.length;
      const perDay = pts.reduce((sum, p) => sum + (p[0] - mx) * (p[1] - my), 0) / pts.reduce((sum, p) => sum + (p[0] - mx) ** 2, 0);
      if (perDay > 1e8) over.append(el('p', '', `At ${fmt(perDay)} a day, the disk is full in about ${ago(D.free / perDay)}.`));
      else if (perDay < -1e8) over.append(el('p', '', `The disk frees ${fmt(-perDay)} a day on average.`));
    }
    if (atRoot) over.append(scheduleEl());
    const cards = [tiles, space, over];

    // What changed, against the scan before or an older one
    const kept = (D.history || []).filter(h => h.dirs);
    if (kept.length > 1) {
      const olders = kept.slice(0, -1), base = olders.find(h => h.d === against) || olders.at(-1), list = changes(base, kept.at(-1), curPath);
      const ch = card('What changed', ''), pick = el('select');
      for (const h of [...olders].reverse()) { const o = el('option', '', `since ${h.d}`); o.value = h.d; o.selected = h === base; pick.append(o) }
      pick.onchange = () => { against = pick.value; renderDash() };
      ch.firstChild.lastChild.replaceWith(pick);
      const max = Math.max(1, ...list.map(x => Math.abs(x.d)));
      if (list.length) ch.append(...list.map(x => barRow(folderLabel(x.p), Math.abs(x.d) / max, delta(0, x.d), null, '#8b93a1', nodeAt(x.p) ? () => go(x.p) : null, 'ch', tilde(x.p))));
      else ch.append(el('p', '', 'No folder grew or shrank by 1 GB or more.'));
      cards.push(ch);
    }
    const junk = card('Regenerable folders', 'Caches, builds and dependencies');
    if (stats.junk.length) junk.append(...stats.junk.slice(0, 8).map(it => barRow(folderLabel(it.p), it.v / stats.junk[0].v, fmt(it.v), null, CATS.junk[1], () => go(it.p), 'ch', tilde(it.p))));
    else junk.append(el('p', '', 'None here.'));
    cards.push(junk);

    // By type (a click searches that type here) and by size
    const scope = atRoot ? '' : ` "${show(curPath).replace(/[\\/]$/, '')}${WIN ? '\\' : '/'}"`;
    const types = card('By type', files ? `${nf(stats.exts.length, 0)} types` : ''), sizes = card('By size', files ? `${nf(files, 0)} files of 1 MB or more` : '');
    const top = stats.exts.slice(0, 12);
    if (top.length) types.append(...top.map(([e, [v, count]]) => barRow(el('code', '', '.' + e), v / top[0][1][0], fmt(v), `${nf(count, 0)} file${count > 1 ? 's' : ''}`,
      CATS[catOf(['x.' + e], '')][1], () => { $('q').value = '.' + e + scope; openPalette() }, '', `Search .${e} files`)));
    else types.append(el('p', '', 'No files of 1 MB or more here.'));
    const most = Math.max(1, ...stats.sizes.map(s => s[0]));
    sizes.append(...SIZES.map(([, name], i) => barRow(name, stats.sizes[i][0] / most, fmt(stats.sizes[i][0]), `${nf(stats.sizes[i][1], 0)} file${stats.sizes[i][1] === 1 ? '' : 's'}`, '#8b93a1')));
    cards.push(types, sizes);
    dash.replaceChildren(...cards);
    dash.scrollTop = scroll;
  }

  // Multi-selection: it survives searches, navigation and view changes until it's deleted or cleared
  const selected = new Map();
  let lastPick = null;
  const selectable = it => !!it?.p && canRm(it.p);
  function pick(it, on = !selected.has(it.p)) {
    if (selectable(it)) on ? selected.set(it.p, it.v) : selected.delete(it.p);
  }
  // A file inside a selected folder goes with it: counted and deleted once
  function picks() {
    const all = [...selected.keys()];
    return [...selected].filter(([p]) => !all.some(q => p.startsWith(q + '/')));
  }
  function syncSel() {
    for (const r of $('list').querySelectorAll('.row')) r.classList.toggle('sel', selected.has(rows[r.dataset.i].p));
    for (const b of $('map').querySelectorAll('.box')) b.classList.toggle('sel', selected.has(boxes[b.dataset.i].p));
    for (const c of $('pal-res').querySelectorAll('.card')) c.classList.toggle('sel', selected.has(cards[c.dataset.i].p));
    $('selbar').hidden = !selected.size;
    if (!selected.size) return;
    const list = picks();
    $('sel-info').textContent = `${nf(list.length, 0)} selected · ${fmt(list.reduce((sum, [, v]) => sum + v, 0))}`;
  }
  $('sel-clear').onclick = () => { selected.clear(); syncSel() };
  $('sel-info').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu('Selection', 'Click an item to deselect it', [...selected].sort((a, b) => b[1] - a[1])
      .map(([p, v]) => menuItem(`${tilde(p)} · ${fmt(v)}`, () => { selected.delete(p); syncSel() })), r.left - 14, r.top - 14);
  };
  $('sel-preview').onclick = () => previewPaths(picks().map(([p]) => p));
  $('sel-finder').onclick = () => app ? app.postMessage({action: 'reveal', paths: picks().map(([p]) => p)})
    : copy(LINUX ? 'xdg-open ' + quote(picks()[0][0].replace(/\/[^/]*$/, '') || '/') : 'open -R ' + picks().map(([p]) => quote(p)).join(' '), 'Command copied: paste it in Terminal');
  $('sel-rm').textContent = app ? 'Delete…' : 'Copy rm -rf';
  $('sel-rm').onclick = () => {
    const list = picks();
    if (app) app.postMessage({action: 'deleteMany', items: list});
    else copy('rm -rf ' + list.map(([p]) => quote(p)).join(' '), `rm command copied for ${nf(list.length, 0)} item${list.length > 1 ? 's' : ''}`);
  };

  function render(fade) {
    closeMenu();
    stack = resolve(decodeURIComponent(location.hash.slice(1)) || root[0]);
    cur = stack.at(-1); curPath = pathOf(stack);
    viewSize = total(cur, curPath) + (stack.length === 1 ? extra.reduce((s, e) => s + e[1], 0) : 0);
    $('crumbs').replaceChildren(...stack.flatMap((n, i) => {
      const a = el('a', '', i ? n[0] : (isDisk ? DISK : show(root[0])));
      a.href = '#' + encodeURIComponent(pathOf(stack.slice(0, i + 1)));
      return i ? [el('i', '', '›'), a] : [a];
    }), el('span', 'here', fmt(total(cur, curPath))));
    const inTrash = trash()?.p === curPath;
    $('cur-rm').hidden = !inTrash;
    $('cur-rm').textContent = app ? `Empty ${TRASH}…` : 'Copy empty-trash command';
    $('cur-rm').onclick = () => emptyTrash(curPath, cur[1]);
    renderPlaces();

    renderLegend();  // before layout: the legend height decides the map height
    const list = view === 'list', dash = view === 'stats', map = $('map');
    for (const b of $('views').children) b.classList.toggle('on', b.dataset.v === view);
    map.hidden = list || dash; $('list').hidden = !list; $('dash').hidden = !dash;
    hovered = undefined; hover(null);
    map.replaceChildren(); boxes = [];
    if (list) renderList();
    else if (dash) renderDash();
    else {
      lastSize = map.clientWidth + 'x' + map.clientHeight;
      layout([...cur[2], ...(stack.length === 1 ? extra : [])], curPath, 0, 0, map.clientWidth, map.clientHeight, 0);
      map.append(ring2, ring);
    }
    const shown = list ? $('list') : dash ? $('dash') : map;
    if (fade && !matchMedia('(prefers-reduced-motion: reduce)').matches) shown.animate([{opacity: 0}, {opacity: 1}], {duration: 180, easing: 'ease-out'});
    applyFocus();
    syncSel();
    if (flash) {
      const i = (list ? rows : boxes).findIndex(it => it.p === flash);
      const node = i >= 0 && shown.querySelector(`[data-i="${i}"]`);
      if (node) { node.classList.add('found'); if (list) node.scrollIntoView({block: 'center'}) }
      flash = null;
    }
  }

  const boxAt = e => { const b = e.target.closest('.box'); return b ? boxes[b.dataset.i] : null };
  let lastMove, frame = 0;
  $('map').addEventListener('mousemove', e => {
    lastMove = e;
    frame ||= requestAnimationFrame(() => {
      frame = 0;
      if (!$('menu').hidden) return;
      hover(boxAt(lastMove));
      moveTip(lastMove.clientX, lastMove.clientY);
    });
  });
  $('map').addEventListener('mouseleave', () => { cancelAnimationFrame(frame); frame = 0; hover(null) });
  $('map').addEventListener('click', e => {
    const it = boxAt(e);
    if (!$('menu').hidden) return closeMenu();
    if (!it || !it.p) return;
    if (e.metaKey || e.ctrlKey) { pick(it); return syncSel() }
    isDir(it.n) ? go(it.p) : openMenu(it, e);
  });
  $('map').addEventListener('contextmenu', e => { const it = boxAt(e); e.preventDefault(); if (it?.p) openMenu(it, e) });

  const rowAt = e => { const r = e.target.closest('.row'); return r ? rows[r.dataset.i] : null };
  // A row: folders expand in place (double-click opens them), files show their menu; a search result jumps to its place
  $('list').addEventListener('click', e => {
    if (!$('menu').hidden) return closeMenu();
    const r = e.target.closest('.row'), it = rowAt(e);
    if (!it?.p) return;
    if (e.target.closest('.ck') || e.metaKey || e.ctrlKey || e.shiftKey) {
      const i = +r.dataset.i, on = !selected.has(it.p);
      if (e.shiftKey && lastPick !== null) for (let j = Math.min(i, lastPick); j <= Math.max(i, lastPick); j++) pick(rows[j], on);
      else pick(it, on);
      lastPick = i;
      return syncSel();
    }
    if (e.target.closest('.more')) return openMenu(it, e);
    if (!isDir(it.n)) return openMenu(it, e);
    if (e.detail > 1) return go(it.p);
    expanded.has(it.p) ? expanded.delete(it.p) : expanded.add(it.p);
    const top = $('list').scrollTop;
    renderList(); applyFocus(); syncSel();
    $('list').scrollTop = top;
  });
  $('list').addEventListener('mouseover', e => { listHover = rowAt(e) });
  $('list').addEventListener('contextmenu', e => { const it = rowAt(e); e.preventDefault(); if (it?.p) openMenu(it, e) });
  $('brand').onclick = e => {
    e.preventDefault();
    view = 'map';
    go(root[0]);
  };
  for (const b of $('views').children) b.onclick = () => {
    view = b.dataset.v;
    render(true);
  };
  $('cur-more').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect(), items = [menuItem(SHOW, () => reveal(curPath)), menuItem('Copy path', () => copyPath(curPath))];
    if (stack.length > 1) items.push(menuItem(claude ? '✦ Ask Claude what this is' : 'Copy AI prompt: what is this?', () => ask(cur, curPath, total(cur, curPath))));
    if (trash()?.p === curPath) items.push(el('hr'), menuItem(app ? `Empty ${TRASH}…` : 'Copy empty-trash command', () => emptyTrash(curPath, cur[1]), 'danger'));
    else if (canRm(curPath)) items.push(el('hr'), menuItem(app ? 'Delete this folder…' : 'Copy rm -rf command', () => remove(curPath, cur[1]), 'danger'));
    showMenu(stack.length > 1 ? cur[0] : isDisk ? DISK : show(root[0]), fmt(total(cur, curPath)), items, r.left - 14, r.bottom - 6);
  };

  $('masked').onclick = e => {
    const r = e.currentTarget.getBoundingClientRect();
    showMenu('Hidden', 'Click to show again', [...[...masked].map(p => menuItem(tilde(p), () => setMask(p, false))), el('hr'), menuItem('Show all', () => setMask(null, false))], r.left - 14, r.bottom - 6);
  };
  document.addEventListener('mousedown', e => {
    if (!$('menu').hidden && !$('menu').contains(e.target) && !$('map').contains(e.target) && !$('list').contains(e.target) && e.target !== $('sel-info')) closeMenu();
  });
  addEventListener('keydown', e => {
    const mod = e.metaKey || e.ctrlKey;
    if (!$('palette').hidden) return paletteKey(e);
    if (mod && (e.key === 'k' || e.key === 'f')) { e.preventDefault(); return openPalette() }
    if (mod && e.key === 'a' && !$('list').hidden) {
      e.preventDefault();
      for (const it of rows) pick(it, true);
      return syncSel();
    }
    if (mod) return;
    if (e.key === 'Escape' && !$('ai').hidden) return closeAI();
    if (e.key === ' ' && !e.target.closest?.('button')) { e.preventDefault(); spacePreview() }
    else if (e.key === '/') { e.preventDefault(); openPalette() }
    else if (e.key === 'Escape' && !$('menu').hidden) closeMenu();
    else if (e.key === 'Escape' && selected.size) { selected.clear(); syncSel() }
    else if ((e.key === 'Backspace' || e.key === 'Escape') && stack.length > 1) { e.preventDefault(); go(pathOf(stack.slice(0, -1))) }
  });
  addEventListener('hashchange', () => render(true));
  let raf, lastSize = '';
  new ResizeObserver(() => {
    if ($('map').hidden || $('map').clientWidth + 'x' + $('map').clientHeight === lastSize) return;
    cancelAnimationFrame(raf); raf = requestAnimationFrame(() => render(false));
  }).observe($('map'));

  // Windows has no header bar like GTK or a menu bar like macOS: the app's commands sit in the toolbar
  if (app && window.evictMenu) {
    $('app-menu').hidden = false;
    $('app-menu').onclick = e => {
      const r = e.currentTarget.getBoundingClientRect();
      showMenu('Evict', window.evictVersion ? `Version ${window.evictVersion}` : '', window.evictMenu.map(([text, id, keys]) => {
        const m = menuItem(text, () => app.postMessage({action: 'menu', id}));
        if (keys) m.append(el('kbd', '', keys));
        return m;
      }), r.right - 220, r.bottom - 6);
    };
  }
  window.evictUpdate = text => {
    $('app-update').hidden = !text;
    $('app-update').textContent = text;
    $('app-update').onclick = () => app.postMessage({action: 'menu', id: 'update'});
  };
  render(true);
  app?.postMessage({action: 'ready'});
}
</script>
</body>
</html>
